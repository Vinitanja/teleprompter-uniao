app = "teleprompter-CHANGEME"
primary_region = "gru"
[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
[mounts]
  source = "tp_data"
  destination = "/app/data"
