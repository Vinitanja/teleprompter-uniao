<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>TELEPROMPTER UNIÃO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff;--fg:#111;--panel:#f2f3f5;--line:#d5d8dd;--accent:#2563eb;--muted:#667}
[data-theme=dark]{--bg:#000;--fg:#f4f4f4;--panel:#16181c;--line:#2c3036;--accent:#60a5fa;--muted:#99a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.55rem .9rem;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
select,input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.4rem .5rem}
/* ---------- editor ---------- */
#editor{max-width:1100px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:1.3rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea#script{width:100%;min-height:36vh;flex:1;resize:vertical;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.5;font-size:1rem}
.count{color:var(--muted);font-size:.85rem}
.settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.settings label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg)}
.settings input[type=range]{width:100%}
.settings output{color:var(--fg);font-weight:600}
#libList .it{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
#libList .it input[type=checkbox],#libAll{width:22px;height:22px;margin-top:2px;flex:none}
#libDelSel:not(:disabled){background:#dc2626;border-color:#dc2626;color:#fff}
#libDelSel:disabled{opacity:.45}
#libList .it.cur{background:var(--panel);border-left:3px solid var(--accent)}
#libList .it small{color:var(--muted);display:block}
#libList button{padding:.3rem .55rem}
.libbar input,.libbar select{min-width:0}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:14px;max-width:560px;width:92vw}
dialog::backdrop{background:#0008}
.mail{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.mail small{color:var(--muted);display:block}
#qr{background:#fff;padding:8px;display:inline-block;border-radius:8px;margin:6px 0}
/* ---------- prompter ---------- */
#prompter{position:fixed;inset:0;background:var(--bg);color:var(--fg);overflow:hidden;display:none;z-index:10}
#rot{position:absolute;left:50%;top:50%;transform-origin:center}
#flip{position:absolute;inset:0;overflow:hidden}
#content{position:absolute;top:0;left:0;right:0;margin:0 auto;will-change:transform;line-height:1.4;word-wrap:break-word}
#content span{transition:opacity .25s ease}
#content span.rd{opacity:.3}
#fadeLayer{position:absolute;inset:0}
.gap{height:1.4em}
#content{letter-spacing:.01em}
#guideLine{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--accent);opacity:.75;pointer-events:none}
#guideHandle{position:absolute;left:6px;width:54px;height:30px;margin-top:-17px;border-radius:15px;background:var(--accent);opacity:.8;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;touch-action:none;cursor:ns-resize;user-select:none;z-index:3}
#guideHandle.drag{opacity:1;outline:3px solid #fff8}
#prompter{touch-action:none;user-select:none;-webkit-user-select:none}
#bar button.on{background:var(--accent);border-color:var(--accent)}
#bar input[type=range]{width:min(200px,40vw)}
#bar .sep{flex-basis:100%;height:0}
#bar{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#000c;color:#fff;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;transition:opacity .3s}
#bar.hide{opacity:0;pointer-events:none}
#bar button{background:#2a2d33;color:#fff;border-color:#444;min-width:44px}
#bar .info{font-size:.8rem;opacity:.85;min-width:7ch;text-align:center}
#prog{position:absolute;left:0;top:0;height:4px;background:var(--accent);width:0}
#level{position:absolute;right:10px;top:10px;width:10px;height:60px;background:#0006;border-radius:5px;overflow:hidden;display:none}
#level i{position:absolute;left:0;right:0;bottom:0;background:#22c55e;height:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:10px;z-index:30;display:none;max-width:90vw;text-align:center}
</style>
</head>
<body data-theme="dark">

<div id="editor">
  <header>
    <h1>🎬 <span data-i="title"></span></h1>
    <div class="row">
      <button id="btnImport" data-i="import"></button>
      <button id="btnInbox" data-i="inbox"></button>
      <button id="btnRemote" data-i="remote"></button>
      <button id="btnClear" data-i="clear"></button>
      <input type="file" id="file" accept=".txt,.md,text/plain" hidden>
    </div>
  </header>

  <div class="row libbar">
    <button id="btnLib">📚 <span data-i="library"></span></button>
    <input type="text" id="title" style="flex:1;min-width:150px">
    <button id="btnNew">➕ <span data-i="newItem"></span></button>
  </div>
  <textarea id="script" spellcheck="false" data-ph="text_ph"></textarea>
  <div class="count" id="count"></div>

  <div class="settings">
    <label><span data-i="mode"></span>
      <select id="mode"><option value="voice" data-i="mode_voice"></option><option value="sound" data-i="mode_sound"></option><option value="auto" data-i="mode_auto"></option></select></label>
    <label><span><span data-i="speed"></span>: <output id="o_speed"></output> px/s</span><input type="range" id="speed" min="10" max="600" step="5"></label>
    <label><span><span data-i="fontSize"></span>: <output id="o_fontSize"></output> px</span><input type="range" id="fontSize" min="16" max="240" step="2"></label>
    <label><span data-i="fontFamily"></span>
      <select id="fontFamily">
        <option>sans-serif</option><option>Arial</option><option>Verdana</option><option>Trebuchet MS</option><option>Georgia</option><option>Times New Roman</option><option>Courier New</option><option>system-ui</option><option>Comic Sans MS</option><option>Impact</option>
      </select></label>
    <label><span><span data-i="width"></span>: <output id="o_width"></output>%</span><input type="range" id="width" min="30" max="100" step="1"></label>
    <label class="chk"><input type="checkbox" id="bold"> <span data-i="bold"></span></label>
    <label class="chk"><input type="checkbox" id="italic"> <span data-i="italic"></span></label>
    <label><span data-i="theme"></span>
      <select id="theme"><option value="dark" data-i="dark"></option><option value="light" data-i="light"></option></select></label>
    <label><span data-i="language"></span>
      <select id="lang"><option value="pt">Português (BR)</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option></select></label>
    <label class="chk"><input type="checkbox" id="mirror"> <span data-i="mirror"></span></label>
    <label><span data-i="mirrorDir"></span>
      <select id="mirrorDir"><option value="h" data-i="horizontal"></option><option value="v" data-i="vertical"></option></select></label>
    <label><span data-i="orientation"></span>
      <select id="orientation"><option value="auto" data-i="orient_auto"></option><option value="landscape" data-i="landscape"></option><option value="portrait" data-i="portrait"></option></select></label>
    <label><span data-i="textColor"></span>
      <select id="textColor"><option value="auto">Auto</option><option value="#ffffff">⬜ Branco</option><option value="#fde047">🟨 Amarelo</option><option value="#4ade80">🟩 Verde</option><option value="#67e8f9">🟦 Ciano</option><option value="#000000">⬛ Preto</option></select></label>
    <label class="chk"><input type="checkbox" id="loop"> <span data-i="loop"></span></label>
    <label class="chk"><input type="checkbox" id="center"> <span data-i="center"></span></label>
    <label class="chk"><input type="checkbox" id="guide"> <span data-i="guide"></span></label>
    <label><span data-i="server"></span><input type="text" id="serverUrl" placeholder="https://meu-app.onrender.com" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
    <label class="chk"><input type="checkbox" id="fade"> <span data-i="fade"></span></label>
    <label><span><span data-i="gapBoost"></span>: <output id="o_gapBoost"></output>×</span><input type="range" id="gapBoost" min="1" max="8" step="0.5"></label>
    <label><span><span data-i="guideY"></span>: <output id="o_guideY"></output>%</span><input type="range" id="guideY" min="8" max="92" step="1"></label>
  </div>
  <div class="row"><button class="primary" id="btnStart" style="flex:1;padding:.9rem" data-i="start"></button></div>
</div>

<div id="prompter">
  <div id="rot">
    <div id="fadeLayer"><div id="flip"><div id="content"></div></div></div>
    <div id="guideLine"></div><div id="guideHandle" title="↕">⇅</div>
    <div id="prog"></div><div id="level"><i></i></div>
    <div id="bar">
      <button id="pBack" title="⏮">⏮</button>
      <button id="pPlay" class="primary">▶</button>
      <button id="pMode" title="Modo: voz / som / automático">⏩</button>
      <button id="pSlow">−</button><span class="info" id="pSpeed"></span><button id="pFast">+</button>
      <input type="range" id="pRange" min="10" max="600" step="5">
      <span class="sep"></span>
      <button id="pBold" title="Negrito"><b>B</b></button>
      <button id="pItalic" title="Itálico"><i>I</i></button>
      <button id="pFontD">A−</button><button id="pFontU">A+</button>
      <button id="pMirror" title="Espelhar">🪞</button>
      <button id="pMirrorDir" title="Eixo do espelho">↔</button>
      <button id="pGuide" title="Linha-guia">━</button>
      <button id="pRestart">↺</button>
      <button id="pExit">✕</button>
    </div>
  </div>
</div>

<dialog id="dlgLib"><h3>📚 <span data-i="library"></span></h3>
  <div class="row"><input type="text" id="libSearch" style="flex:1;min-width:120px"><button id="libNewItem">➕</button></div>
  <div class="row" id="libSelBar" style="margin-top:10px;justify-content:space-between"><label class="chk" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="libAll"> <span data-i="selectAll"></span></label><button id="libDelSel" disabled>🗑 <span data-i="deleteSel"></span> (<span id="libSelN">0</span>)</button></div>
  <div id="libList" style="max-height:48vh;overflow:auto;margin:6px 0 10px"></div>
  <div class="row" style="justify-content:space-between"><div class="row"><button id="libExport">⬇ <span data-i="backup"></span></button><button id="libImport">⬆ <span data-i="restore"></span></button></div><button id="libClose" data-i="close"></button></div>
  <input type="file" id="libFile" accept=".json,application/json" hidden></dialog>
<dialog id="dlgInbox"><h3 data-i="inbox_title"></h3><p class="count" id="inboxHelp"></p><div id="mails"></div>
  <div class="row" style="margin-top:12px;justify-content:flex-end"><button id="inboxRefresh">↻</button><button id="inboxClose" data-i="close"></button></div></dialog>

const idb = {
  db:null,
  open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('tp',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));},
  async get(k){try{const d=await this.open();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined);});}catch{return undefined}},
  async del(k){try{const d=await this.open();d.transaction('kv','readwrite').objectStore('kv').delete(k);}catch{}},

const BIND = ['mode','speed','fontSize','fontFamily','width','bold','italic','theme','lang','mirror','mirrorDir','orientation','loop','center','guide','guideY','fade','gapBoost','textColor','serverUrl'];

const saveMeta=()=>idb.set('lib',JSON.parse(JSON.stringify(lib)));
const metaOf=txt=>({size:txt.length,preview:txt.slice(0,140).replace(/\s+/g,' '),updated:Date.now()});
let saveTimer, pendingSave=null;
async function flushSave(){ clearTimeout(saveTimer); if(pendingSave){ const f=pendingSave; pendingSave=null; await f(); } }
function scheduleSave(){
  const id=lib.currentId, val=$('script').value;
  pendingSave=async()=>{ const it=lib.items.find(i=>i.id===id); await idb.set('text:'+id,val); if(it){ Object.assign(it,metaOf(val)); await saveMeta(); } };
  clearTimeout(saveTimer); saveTimer=setTimeout(flushSave,400);
}
$('script').addEventListener('input',()=>{ updateCount(); scheduleSave(); sendText(800); });
window.addEventListener('pagehide',()=>{ flushSave(); }); document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushSave(); });
async function openItem(id){
  await flushSave(); const it=lib.items.find(i=>i.id===id); if(!it)return;
  lib.currentId=id; $('script').value=(await idb.get('text:'+id))||''; $('title').value=it.title;
  updateCount(); await saveMeta(); sendText(150);
}
async function newItem(title,text){
  await flushSave(); const id=uid(); text=text||'';
  const it={id,title:title||`${t('untitled')} ${lib.items.length+1}`,...metaOf(text)};
  lib.items.push(it); await idb.set('text:'+id,text); await openItem(id); return it;
}
async function loadLib(){

  else { const old=(await idb.get('script'))||''; const id=uid(); lib.items=[{id,title:t('untitled')+' 1',...metaOf(old)}]; lib.currentId=id; await idb.set('text:'+id,old); await saveMeta(); }

}

const selected=new Set();
async function deleteMany(ids){
  const set=new Set(ids); const wasCur=set.has(lib.currentId);
  lib.items=lib.items.filter(i=>!set.has(i.id)); for(const id of set) await idb.del('text:'+id);
  if(wasCur){ lib.currentId=null; if(lib.items.length) await openItem(lib.items.slice().sort((a,b)=>b.updated-a.updated)[0].id); else await newItem(); } else await saveMeta();
}
function renderLib(){
  const box=$('libList'); box.textContent=''; const q=$('libSearch').value.trim().toLowerCase();
  const mk=(tag,cls,txt)=>{ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; };
  const ids=new Set(lib.items.map(i=>i.id)); for(const id of [...selected]) if(!ids.has(id)) selected.delete(id);
  const vis=lib.items.filter(i=>!q||i.title.toLowerCase().includes(q)||(i.preview||'').toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated);
  const sync=()=>{ $('libSelN').textContent=selected.size; $('libDelSel').disabled=!selected.size; $('libAll').checked=vis.length>0&&vis.every(i=>selected.has(i.id)); $('libAll').indeterminate=selected.size>0&&!$('libAll').checked; };
  for(const i of vis){
    const r=mk('div','it'+(i.id===lib.currentId?' cur':''));
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=selected.has(i.id); cb.onchange=()=>{ cb.checked?selected.add(i.id):selected.delete(i.id); sync(); };
    const info=mk('div'); info.style.cssText='cursor:pointer;flex:1;min-width:0';
    info.append(mk('b',null,i.title||t('untitled')),mk('small',null,`${(i.size||0).toLocaleString()} ${t('chars')} · ${new Date(i.updated).toLocaleDateString()}`),mk('small',null,i.preview||''));
    info.onclick=async()=>{ await openItem(i.id); $('dlgLib').close(); };
    const dup=mk('button',null,'⧉'); dup.title=t('dup'); dup.onclick=async()=>{ await flushSave(); const tx=(await idb.get('text:'+i.id))||''; await newItem(`${i.title} (${t('copy')})`,tx); renderLib(); };
    r.append(cb,info,dup); box.append(r);
  }
  if(!vis.length) box.append(mk('p','count',t('empty_lib')));
  sync();
}
$('libAll').onchange=()=>{ const q=$('libSearch').value.trim().toLowerCase(); const vis=lib.items.filter(i=>!q||i.title.toLowerCase().includes(q)||(i.preview||'').toLowerCase().includes(q)); vis.forEach(i=>$('libAll').checked?selected.add(i.id):selected.delete(i.id)); renderLib(); };
$('libDelSel').onclick=async()=>{
  const n=selected.size; if(!n)return;

$('btnLib').onclick=async()=>{ await flushSave(); $('libSearch').value=''; selected.clear(); renderLib(); $('dlgLib').showModal(); };
$('libClose').onclick=()=>$('dlgLib').close(); $('libSearch').oninput=renderLib;

$('libFile').onchange=async e=>{

async function loadInbox(){
  const box=$('mails'); box.textContent='…';
  try{
    const r=await fetch(base()+'/api/inbox'); if(!r.ok)throw 0; const list=await r.json();
    box.innerHTML=''; if(!list.length){box.textContent=t('no_mail');return;}
    for(const m of list){

      const use=document.createElement('button'); use.textContent=t('load'); use.className='primary';

}

/* =============== Controle remoto (WebSocket) =============== */
let room = localStorage.getItem('tp-room') || '';
const newRoomCode=()=>{ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from(crypto.getRandomValues(new Uint8Array(6)),n=>a[n%a.length]).join(''); };
if(!room){ room=newRoomCode(); localStorage.setItem('tp-room',room); }
let ws, wsRetry, controllersN=0;
// endereço do servidor: o informado nas configurações (útil no app Android) ou o do próprio site
const isNative=()=>{ try{ return !!window.Capacitor?.isNativePlatform?.(); }catch{ return false; } };
// true quando a página veio de um servidor (site ou app Android carregando o site); false no app com arquivos embutidos (https://localhost)
const hostedHere=()=>/^https?:/.test(location.protocol)&&!(isNative()&&location.hostname==='localhost');
function base(){
  let u=(S.serverUrl||'').trim().replace(/\/+$/,''); if(u&&!/^https?:\/\//i.test(u)) u='https://'+u;
  if(u) return u; return hostedHere()?location.origin:'';
}
function connectWS(){
  clearTimeout(wsRetry); try{ if(ws){ ws.onclose=null; ws.close(); } }catch{}
  const b=base(); if(!b) return;
  ws=new WebSocket(`${b.replace(/^http/i,'ws')}/ws?room=${room}&role=prompter`);
  ws.onmessage=e=>{ let m; try{m=JSON.parse(e.data);}catch{return;}
    if(m.type==='cmd') command(m.cmd,m.value);
    if(m.type==='needText') sendText(0);
    if(m.type==='push') applyPush(m);
    if(m.type==='presence'){ controllersN=m.controllers; $('remoteStatus').textContent = m.controllers>0?'✅ '+t('connected'):t('waiting'); if(m.controllers>0){ sendState(true); sendText(0); } } };
  ws.onclose=()=>{ wsRetry=setTimeout(connectWS,3000); };
  ws.onerror=()=>{};
}
let lastSent=0;
function sendState(force){
  if(!ws||ws.readyState!==1)return; const n=performance.now(); if(!force&&n-lastSent<120)return; lastSent=n;
  ws.send(JSON.stringify({type:'state',state:{playing:running,speed:S.speed,fontSize:S.fontSize,progress:maxPos>0?pos/maxPos:0,mode:S.mode,mirror:S.mirror,theme:S.theme,loop:S.loop,open:prompterOpen,bold:S.bold,guide:S.guide,
    word:(prompterOpen&&spans.length)?(MODE()==='voice'&&running?cur:wordAtPos(pos)):0,total:W.length}}));
}
// texto atual -> controle remoto (para acompanhar a leitura)
let textT; function sendText(delay=0){
  clearTimeout(textT); textT=setTimeout(()=>{ if(ws&&ws.readyState===1&&controllersN>0) ws.send(JSON.stringify({type:'text',value:$('script').value})); },delay);
}
// texto enviado pelo link /enviar (ou atualizado) -> vai direto para o app
function liveRebuild(){
  const w=spans.length?wordAtPos(pos):0; buildText(); layout();
  pos=Math.max(0,Math.min(maxPos,(tops[Math.min(w,tops.length-1)]||0)-lineY)); targetPos=pos; cur=MODE()==='voice'?Math.min(w,W.length-1):0; markRead(); render();
}
async function applyPush(m){
  const title=(m.title||'').trim()||t('untitled'), text=String(m.text||'');
  const it=m.update!==false?lib.items.find(i=>i.title===title):null;
  if(it){
    if(it.id===lib.currentId){ clearTimeout(saveTimer); pendingSave=null; }
    await idb.set('text:'+it.id,text); Object.assign(it,metaOf(text)); await saveMeta();
    if(it.id===lib.currentId){ $('script').value=text; updateCount(); if(prompterOpen) liveRebuild(); sendText(0); }
    toast('🔄 '+title+' — '+t('updated'));
  } else {
    const id=uid(), ni={id,title,...metaOf(text)}; lib.items.push(ni); await idb.set('text:'+id,text); await saveMeta();
    if(!prompterOpen) await openItem(id);
    toast('📥 '+title+' — '+t('received'));
  }
  if($('dlgLib').open) renderLib();
}
function showRemote(){
  $('roomCode').textContent=room;
  const b=base(); const url=`${b}/remote?room=${room}`, surl=`${b}/enviar?room=${room}`;
  const a=$('remoteLink'); a.href=url; a.textContent=url; const a2=$('sendLink'); a2.href=surl; a2.textContent=surl;
  const q=$('qr'); q.innerHTML=''; if(window.QRCode){ new QRCode(q,{text:url,width:150,height:150}); } else q.style.display='none';
  if(window.QRCode) q.style.display='inline-block';
  if(!b) $('remoteStatus').textContent=t('offline_remote');
  $('dlgRemote').showModal();

$('btnRemote').onclick=showRemote; $('remoteClose').onclick=()=>$('dlgRemote').close();
$('newRoom').onclick=()=>{ room=newRoomCode(); localStorage.setItem('tp-room',room); connectWS(); showRemote(); $('dlgRemote').close(); showRemote(); };

/* =============== Teleprompter =============== */
const P=$('prompter'), ROT=$('rot'), MIR=$('flip'), FADE=$('fadeLayer'), CONT=$('content'), GUIDE=$('guideLine'), HANDLE=$('guideHandle');
let prompterOpen=false, running=false, pos=0, maxPos=0, lineY=0, W=[], spans=[], tops=[], topsDirty=true, cur=0, marked=0, targetPos=0, vel=0, lastT=0, endHold=0;
let rotated=false, vw=0, vh=0, holding=false, fallbackMode=null, gaps=[], gapR=[];
const MODE=()=>fallbackMode||S.mode;

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\p{L}\p{N}]/gu,'');

function buildText(){
  const text=$('script').value; CONT.textContent=''; W=[]; spans=[]; gaps=[]; marked=0; cur=0;
  const lines=text.replace(/\r\n?/g,'\n').split('\n');
  const frag=document.createDocumentFragment();
  for(const line of lines){
    for(const tok of line.split(/[ \t]+/)){ if(!tok)continue;
      const sp=document.createElement('span'); sp.textContent=tok+' '; frag.appendChild(sp); spans.push(sp); W.push(norm(tok)); }
    if(line.trim()) frag.appendChild(document.createElement('br'));
    else { const g=document.createElement('div'); g.className='gap'; frag.appendChild(g); gaps.push(g); }
  }
  CONT.appendChild(frag); topsDirty=true;
}

function layout(){
  vw=window.innerWidth; vh=window.innerHeight;
  const want=S.orientation; const isLand=vw>=vh;
  rotated = (want==='landscape'&&!isLand)||(want==='portrait'&&isLand);
  const w=rotated?vh:vw, h=rotated?vw:vh;
  ROT.style.width=w+'px'; ROT.style.height=h+'px';
  ROT.style.transform=`translate(-50%,-50%)${rotated?' rotate(90deg)':''}`;
  lineY=Math.round(h*Math.min(92,Math.max(8,S.guideY))/100);
  Object.assign(CONT.style,{fontSize:S.fontSize+'px',fontFamily:S.fontFamily,fontWeight:S.bold?'700':'400',fontStyle:S.italic?'italic':'normal',color:S.textColor==='auto'?'':S.textColor,width:S.width+'%',textAlign:S.center?'center':'left',paddingTop:lineY+'px',paddingBottom:(h-lineY)+'px'});
  GUIDE.style.top=(lineY-4)+'px'; GUIDE.style.display=S.guide?'block':'none'; HANDLE.style.top=(lineY-4)+'px'; HANDLE.style.display=S.guide?'flex':'none';
  MIR.style.transform=S.mirror?(S.mirrorDir==='v'?'scaleY(-1)':'scaleX(-1)'):'none';
  applyFade(h);
  topsDirty=true; measure();
}
function applyFade(h){
  const m=v=>{ FADE.style.webkitMaskImage=v; FADE.style.maskImage=v; };
  if(!S.fade){ m('none'); return; }
  const fs=S.fontSize, L=lineY;
  let st=[[0,.03],[L-3.2*fs,.08],[L-1.6*fs,.16],[L-.6*fs,.32],[L,.85],[L+.25*fs,1]].map(([y,a])=>[Math.max(0,Math.min(h,y)),a]);
  if(S.mirror&&S.mirrorDir==='v') st=st.map(([y,a])=>[h-y,a]).reverse();
  st=st.map(([y,a],i,arr)=>[i&&y<arr[i-1][0]?arr[i-1][0]:y,a]);
  m(`linear-gradient(to bottom,${st.map(([y,a])=>`rgba(0,0,0,${a}) ${y.toFixed(1)}px`).join(',')})`);
}
function measure(){
  const h=parseFloat(ROT.style.height)||vh;
  maxPos=Math.max(0,CONT.scrollHeight-h);
  if(topsDirty){ tops=spans.map(s=>s.offsetTop); gapR=gaps.map(g=>[g.offsetTop,g.offsetTop+g.offsetHeight]); topsDirty=false; }
  pos=Math.min(pos,maxPos);
}
window.addEventListener('resize',()=>{ if(prompterOpen) layout(); });

async function tryOrientationLock(){
  try{
    if(S.orientation==='auto'){ screen.orientation?.unlock?.(); return; }
    if(!document.fullscreenElement) await P.requestFullscreen?.();
    await screen.orientation.lock(S.orientation);
  }catch{} // sem suporte: usa rotação por CSS
}
function onSettingChange(k){ if(k==='serverUrl'){ clearTimeout(window._sv); window._sv=setTimeout(connectWS,600); return; } if(prompterOpen) { layout(); } }

function setPos(p){ pos=Math.max(0,Math.min(maxPos,p)); render(); }
function render(){
  CONT.style.transform=`translate3d(0,${-pos.toFixed(2)}px,0)`;
  $('prog').style.width=(maxPos>0?pos/maxPos*100:0)+'%';
  sendState();
}
function inGap(y){ let lo=0,hi=gapR.length-1,r=-1; while(lo<=hi){ const m=(lo+hi)>>1; if(gapR[m][0]<=y){r=m;lo=m+1;} else hi=m-1; } return r>=0&&y<gapR[r][1]; }
function wordAtPos(p){ // índice da primeira palavra cuja posição >= linha-guia
  const y=p+lineY; let lo=0,hi=tops.length-1;
  while(lo<hi){ const m=(lo+hi)>>1; if(tops[m]<y-1)lo=m+1; else hi=m; }
  return lo;
}
function markRead(){
  if(cur>marked){ for(let i=marked;i<cur&&i<spans.length;i++)spans[i].classList.add('rd'); }
  else if(cur<marked){ for(let i=cur;i<marked&&i<spans.length;i++)spans[i].classList.remove('rd'); }
  marked=cur;
}

/* ---- loop de animação ---- */
function tick(ts){
  if(!prompterOpen)return; requestAnimationFrame(tick);
  const dt=Math.min(0.1,(ts-lastT)/1000||0); lastT=ts;
  if(topsDirty) measure();
  if(running&&!holding){
    const gb=inGap(pos+lineY)?Math.max(1,S.gapBoost):1;
    if(MODE()==='auto'){ pos+=S.speed*gb*dt; }
    else if(MODE()==='sound'){ const goal=(level>SOUND_THR)?S.speed:0; vel+=(goal-vel)*Math.min(1,dt*6); pos+=vel*gb*dt; }
    else { // voz: acompanha a palavra reconhecida
      if(tops.length&&cur<tops.length){ targetPos=Math.max(0,tops[cur]-lineY); }
      const d=targetPos-pos; pos+=Math.sign(d)*Math.min(Math.abs(d),Math.max(Math.abs(d)*dt*4*gb,Math.abs(d)>1?30*dt*gb:0));
      markRead();
    }
    if(pos>=maxPos-0.5 && (MODE()!=='voice'||cur>=W.length-1)){
      pos=maxPos;
      if(S.loop){ endHold+=dt; if(endHold>1.5){ endHold=0; pos=0; cur=0; targetPos=0; vel=0; markRead(); } }
      else if(MODE()!=='voice'){ setRunning(false); }
    } else endHold=0;
    pos=Math.max(0,Math.min(maxPos,pos));
  }
  render();
  if(micOn) $('level').firstElementChild.style.height=Math.min(100,level*400)+'%';
}

/* ---- microfone: nível de volume ---- */
let audioCtx, analyser, micStream, micBuf, level=0, micOn=false; const SOUND_THR=0.02;
async function startLevelMic(){
  if(micOn)return true;
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)(); const src=audioCtx.createMediaStreamSource(micStream);
    analyser=audioCtx.createAnalyser(); analyser.fftSize=1024; src.connect(analyser); micBuf=new Float32Array(analyser.fftSize);
    micOn=true; $('level').style.display='block'; levelLoop(); return true;
  }catch{ toast(t('micDenied')); return false; }
}
function levelLoop(){
  if(!micOn)return; analyser.getFloatTimeDomainData(micBuf);
  let s=0; for(let i=0;i<micBuf.length;i++)s+=micBuf[i]*micBuf[i]; const rms=Math.sqrt(s/micBuf.length);
  level=level*0.6+rms*0.4; setTimeout(levelLoop,40);
}
function stopLevelMic(){ micOn=false; try{micStream?.getTracks().forEach(t=>t.stop());if(audioCtx&&audioCtx.state!=='closed')audioCtx.close();}catch{} $('level').style.display='none'; level=0; }

/* ---- microfone: reconhecimento de fala ---- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec, recWanted=false, nativeL=[];
const nativeSR=()=>{ try{ return window.Capacitor?.isNativePlatform?.() ? window.Capacitor.Plugins.SpeechRecognition : null; }catch{ return null; } };
async function startNativeRec(P){
  const perm=await P.requestPermissions().catch(()=>({})); if(perm.speechRecognition==='denied'){ toast(t('micDenied')); setRunning(false); return; }
  recWanted=true;
  const begin=()=>P.start({language:SPEECH_LANG[S.lang],partialResults:true,popup:false,maxResults:1}).catch(()=>{});
  nativeL=[ await P.addListener('partialResults',d=>{ if(d.matches&&d.matches[0]) onSpeech(d.matches[0]); }),
            await P.addListener('listeningState',d=>{ if(d.status==='stopped'&&recWanted&&running) setTimeout(begin,200); }) ];
  begin();
}
function startRec(){
  const NP=nativeSR(); if(NP){ startNativeRec(NP); return; }
  if(!SR){ toast(t('noSR')); fallbackMode='sound'; return startLevelMic(); }
  recWanted=true;
  rec=new SR(); rec.lang=SPEECH_LANG[S.lang]; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
  rec.onresult=e=>{ const r=e.results[e.results.length-1]; onSpeech(r[0].transcript); };
  rec.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed'){ recWanted=false; toast(t('micDenied')); setRunning(false);} };
  rec.onend=()=>{ if(recWanted&&running) setTimeout(()=>{ try{rec.start();}catch{} },150); };
  try{ rec.start(); }catch{}
  $('level').style.display='none';
}
function stopRec(){ recWanted=false; try{rec?.abort();}catch{} const NP=nativeSR(); if(NP){ NP.stop().catch(()=>{}); nativeL.forEach(l=>l.remove&&l.remove()); nativeL=[]; } }

function like(a,b){
  if(!a||!b)return false; if(a===b)return true; if(a.length<4||b.length<4)return false;
  if(a.startsWith(b)||b.startsWith(a))return Math.min(a.length,b.length)>=4;
  if(Math.abs(a.length-b.length)>1)return false;
  let i=0; while(i<a.length&&a[i]===b[i])i++; // distância de edição <= 1
  if(a.length===b.length) return a.slice(i+1)===b.slice(i+1);
  const [l,s]=a.length>b.length?[a,b]:[b,a]; return l.slice(i+1)===s.slice(i);
}
function onSpeech(transcript){
  const words=transcript.split(/\s+/).map(norm).filter(Boolean); if(!words.length)return;
  const tail=words.slice(-4); let best=-1,bs=0;
  const from=Math.max(0,cur-3), to=Math.min(W.length-1,cur+40);
  for(let j=from;j<=to;j++){
    if(!like(tail[tail.length-1],W[j]))continue;
    let s=1.5;
    for(let k=1;k<tail.length&&j-k>=0;k++) if(like(tail[tail.length-1-k],W[j-k])) s+=1;
    s-=Math.max(0,j-cur)*0.01;
    if(j-cur>8&&s<2.4)continue;            // saltos longos exigem 2+ palavras batendo
    if(s>bs||(s===bs&&best>=0&&Math.abs(j-cur)<Math.abs(best-cur))){bs=s;best=j;}
  }
  if(best>=0&&best+1!==cur){ cur=best+1; }
}

/* ---- controle de execução ---- */
async function setRunning(on){
  if(on&&!running){
    if(MODE()==='voice'){ if(SR||nativeSR()) startRec(); else { fallbackMode='sound'; toast(t('noSR')); if(!await startLevelMic()) return; } }
    else if(MODE()==='sound'){ if(!await startLevelMic()) return; }
    running=true; vel=0;
    if(MODE()==='voice'){ cur=wordAtPos(pos); markRead(); }
  } else if(!on){ running=false; stopRec(); if(MODE()!=='sound') stopLevelMic(); }
  $('pPlay').textContent=running?'⏸':'▶'; showBar(); sendState(true);
}
function showSpeed(){
  $('pMode').textContent={voice:'🎤',sound:'🔊',auto:'⏩'}[MODE()]||'⏩';
  $('pSpeed').textContent=MODE()==='voice'?'—':S.speed+' px/s';
  $('pRange').value=S.speed; $('pRange').style.opacity=MODE()==='voice'?.4:1;
  const on=(id,v)=>$(id).classList.toggle('on',!!v);
  on('pBold',S.bold); on('pItalic',S.italic); on('pMirror',S.mirror); on('pGuide',S.guide);
  $('pMirrorDir').textContent=S.mirrorDir==='v'?'↕':'↔';
}
function open_(){
  const txt=$('script').value; if(!txt.trim()){ toast(t('empty')); return; }
  buildText(); prompterOpen=true; pos=0; targetPos=0; P.style.display='block'; document.body.style.overflow='hidden';
  layout(); render(); showSpeed(); showBar(); lastT=performance.now(); requestAnimationFrame(tick);
  tryOrientationLock().then(()=>{ if(prompterOpen) layout(); });
  navigator.wakeLock?.request('screen').then(l=>wake=l).catch(()=>{});
  sendState(true);
}
let wake;
function close_(){
  setRunning(false); stopLevelMic(); prompterOpen=false; P.style.display='none'; document.body.style.overflow='';
  try{wake?.release();}catch{} try{screen.orientation?.unlock?.();}catch{} if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
  sendState(true);
}
let barT; function showBar(){ $('bar').classList.remove('hide'); clearTimeout(barT); barT=setTimeout(()=>{ if(running)$('bar').classList.add('hide'); },3500); }

function command(cmd,val){
  const step=()=>Math.max(80,vh*0.3);
  switch(cmd){
    case 'open': if(!prompterOpen)open_(); break;
    case 'toggle': if(!prompterOpen)open_(); setRunning(!running); break;
    case 'play': setRunning(true); break;
    case 'pause': setRunning(false); break;
    case 'faster': S.speed=Math.min(600,S.speed+10); break;
    case 'slower': S.speed=Math.max(10,S.speed-10); break;
    case 'fontUp': S.fontSize=Math.min(240,S.fontSize+4); layoutKeep(); break;
    case 'fontDown': S.fontSize=Math.max(16,S.fontSize-4); layoutKeep(); break;
    case 'back': jump(-step()); break;
    case 'forward': jump(step()); break;
    case 'restart': pos=0; cur=0; targetPos=0; markRead(); render(); break;
    case 'mirror': S.mirror=!S.mirror; layout(); break;
    case 'mirrorDir': S.mirrorDir=S.mirrorDir==='v'?'h':'v'; layout(); break;
    case 'bold': S.bold=!S.bold; layoutKeep(); break;
    case 'italic': S.italic=!S.italic; layoutKeep(); break;
    case 'guide': S.guide=!S.guide; layout(); break;
    case 'speed': S.speed=Math.max(10,Math.min(600,+val||S.speed)); break;
    case 'mode': { const was=running; setRunning(false); stopLevelMic(); fallbackMode=null; S.mode={voice:'sound',sound:'auto',auto:'voice'}[S.mode]||'auto'; if(MODE()!=='voice'){ cur=0; markRead(); } else { cur=wordAtPos(pos); } if(was||S.mode!=='auto') setRunning(true); break; }
    case 'theme': S.theme=S.theme==='dark'?'light':'dark'; break;
    case 'loop': S.loop=!S.loop; break;
    case 'close': close_(); break;
  }
  saveS(); syncUI(); showSpeed(); showBar(); sendState(true);
}
function layoutKeep(){ const ratio=maxPos>0?pos/maxPos:0; layout(); pos=ratio*maxPos; if(MODE()==='voice')targetPos=pos; render(); }
function jump(d){
  pos=Math.max(0,Math.min(maxPos,pos+d)); targetPos=pos;
  if(MODE()==='voice'){ cur=wordAtPos(pos); markRead(); } render();
}

$('btnStart').onclick=()=>{ open_(); if(prompterOpen) setRunning(true); };
$('pMode').onclick=()=>command('mode'); $('pBold').onclick=()=>command('bold'); $('pItalic').onclick=()=>command('italic');
$('pMirror').onclick=()=>command('mirror'); $('pMirrorDir').onclick=()=>command('mirrorDir'); $('pGuide').onclick=()=>command('guide');
$('pRange').oninput=e=>command('speed',e.target.value);
$('pPlay').onclick=()=>command('toggle'); $('pBack').onclick=()=>command('back');
$('pSlow').onclick=()=>command('slower'); $('pFast').onclick=()=>command('faster');
$('pFontD').onclick=()=>command('fontDown'); $('pFontU').onclick=()=>command('fontUp');
$('pRestart').onclick=()=>command('restart'); $('pExit').onclick=()=>command('close');
// deslocamento do dedo na tela -> eixo vertical do texto (considera rotação e espelho vertical)
const localDY=(dx,dy)=>{ let d=rotated?-dx:dy; if(S.mirror&&S.mirrorDir==='v') d=-d; return d; };
let drag=null;
P.addEventListener('pointerdown',e=>{
  showBar(); if(e.target.closest('#bar,#guideHandle'))return;
  drag={lx:e.clientX,ly:e.clientY,sx:e.clientX,sy:e.clientY,moved:false}; holding=true;
  try{P.setPointerCapture(e.pointerId);}catch{}
});
P.addEventListener('pointermove',e=>{
  showBar(); if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>10) drag.moved=true;
  if(drag.moved){ jump(-localDY(e.clientX-drag.lx,e.clientY-drag.ly)); }
  drag.lx=e.clientX; drag.ly=e.clientY;
});
const endDrag=e=>{ if(!drag)return; const tap=!drag.moved&&e.type==='pointerup'; drag=null; holding=false; if(tap) command('toggle'); };
P.addEventListener('pointerup',endDrag); P.addEventListener('pointercancel',endDrag);
P.addEventListener('wheel',e=>{ e.preventDefault(); jump(localDY(0,e.deltaY)); },{passive:false});

// Linha-guia arrastável: coloque onde quiser
let gdrag=null;
HANDLE.addEventListener('pointerdown',e=>{ e.stopPropagation(); gdrag={x:e.clientX,y:e.clientY,start:lineY}; HANDLE.classList.add('drag'); HANDLE.setPointerCapture(e.pointerId); showBar(); });
HANDLE.addEventListener('pointermove',e=>{
  if(!gdrag)return; const h=parseFloat(ROT.style.height)||vh;
  const ny=Math.max(h*.08,Math.min(h*.92,gdrag.start+(rotated?-(e.clientX-gdrag.x):(e.clientY-gdrag.y))));
  GUIDE.style.top=(ny-4)+'px'; HANDLE.style.top=(ny-4)+'px'; gdrag.ny=ny;
});
const endG=()=>{ if(!gdrag)return; const g=gdrag; gdrag=null; HANDLE.classList.remove('drag');
  if(g.ny==null)return; const h=parseFloat(ROT.style.height)||vh; const old=lineY;
  S.guideY=Math.round(g.ny/h*100); saveS(); syncUI(); layout(); pos=Math.max(0,Math.min(maxPos,pos+(lineY-old))); if(MODE()==='voice')targetPos=Math.max(0,(tops[cur]||0)-lineY); render(); };
HANDLE.addEventListener('pointerup',endG); HANDLE.addEventListener('pointercancel',endG);

// Teclado (inclui controles/clickers Bluetooth que emulam teclado)
document.addEventListener('keydown',e=>{
  if(!prompterOpen||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)&&e.key!=='Escape')return;
  const map={' ':'toggle',Enter:'toggle','.':'toggle',b:'toggle',B:'toggle',MediaPlayPause:'toggle',ArrowUp:'faster',ArrowDown:'slower',PageDown:'forward',ArrowRight:'forward',MediaTrackNext:'forward',PageUp:'back',ArrowLeft:'back',MediaTrackPrevious:'back','+':'fontUp','=':'fontUp','-':'fontDown',m:'mirror',r:'restart',Escape:'close'};
  const c=map[e.key]; if(c){ e.preventDefault(); command(c); }
});

/* =============== init =============== */
(async()=>{
  syncUI(); applyI18n();
  await loadLib();
  connectWS();
  if('serviceWorker' in navigator && hostedHere()) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
window.__tp={get cur(){return cur},get pos(){return pos},get W(){return W},onSpeech,command,get S(){return S}};
</script>
