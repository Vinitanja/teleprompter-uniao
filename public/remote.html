<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Controle – TELEPROMPTER UNIÃO</title><link rel="icon" href="icon.svg">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b0c0f;color:#eee;font-family:system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:#9aa;margin-bottom:6px}
.top button{padding:.3rem .6rem;font-size:.9rem}
.bar{height:6px;background:#222;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:#60a5fa;width:0;transition:width .2s}
#view{flex:1;min-height:120px;position:relative;overflow:hidden;margin:8px 0;border:1px solid #2a2e36;border-radius:12px;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
#view::before,#view::after{content:"";position:absolute;left:0;right:0;height:22%;z-index:2;pointer-events:none}
#view::before{top:0;background:linear-gradient(#000,#0000)}#view::after{bottom:0;background:linear-gradient(#0000,#000)}
#txt{position:absolute;left:0;right:0;top:0;padding:0 16px;line-height:1.45;transition:transform .35s ease-out;will-change:transform}
#txt span.rd{opacity:.35}#txt span.now{background:#2563eb66;border-radius:4px;color:#fff}.gap{height:1.4em}
#empty{position:absolute;inset:0;display:grid;place-items:center;color:#667;text-align:center;padding:20px}
#hud{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000d;border:1px solid #555;border-radius:20px;padding:6px 16px;font-size:1.2rem;display:none;z-index:3}
#tip{position:absolute;right:8px;bottom:8px;font-size:.7rem;color:#667;z-index:3;pointer-events:none}
.sp{display:flex;align-items:center;gap:8px;margin-bottom:8px}.sp input{flex:1}.sp b{min-width:4.5ch;text-align:center}
.g{display:grid;gap:8px;margin-bottom:8px}.g5{grid-template-columns:repeat(6,1fr)}.g6{grid-template-columns:1fr 4fr 1fr}
button{padding:.75rem .2rem;font-size:1.05rem;border-radius:12px;border:1px solid #333;background:#1b1e24;color:#fff;touch-action:manipulation}
button:active{background:#2563eb}button.on{background:#2563eb}button.big{background:#2563eb;font-weight:700;font-size:1.2rem}
details{font-size:.85rem;color:#9aa}input[type=text]{background:#1b1e24;border:1px solid #333;color:#fff;border-radius:8px;padding:.4rem;width:8em;text-transform:uppercase}
</style></head><body>
<div class="top"><span id="st">Conectando…</span><span><button data-c="fontDown">A−</button> <b id="fs" style="color:#eee">–</b> <button data-c="fontUp">A+</button></span></div>
<div class="bar"><i id="pr"></i></div>
<div id="view"><div id="empty">Aguardando o texto do app…<br><small>Abra o app e conecte-se a este código.</small></div><div id="txt"></div><div id="hud"></div><div id="tip">↕ arraste: velocidade · toque: ▶/⏸</div></div>
<div class="sp"><button data-c="slower">−</button><input type="range" id="rng" min="10" max="600" step="5" value="60"><button data-c="faster">+</button><b id="spd">60</b></div>
<div class="g g6"><button data-c="back">⏮</button><button class="big" data-c="toggle" id="play">▶ Iniciar</button><button data-c="forward">⏭</button></div>
<div class="g g5"><button data-c="mode" id="mode">🎤</button><button data-c="caps" id="caps">AA</button><button data-c="bold" id="bold"><b>B</b></button><button data-c="mirror" id="mirror">🪞</button><button data-c="guide" id="guide">━</button><button data-c="restart">↺</button></div>
<details><summary>Código do app / mais</summary><p>Tamanho do texto <u>neste controle</u>: <button data-v="-2" style="padding:.4rem .7rem">🔍−</button> <button data-v="2" style="padding:.4rem .7rem">🔍+</button></p><p>Código: <input id="room" maxlength="16"> <button data-c="open" style="padding:.4rem .7rem">📺 Abrir</button> <button data-c="close" style="padding:.4rem .7rem">✕ Fechar</button> <button data-c="theme" style="padding:.4rem .7rem">🌗</button> <button data-c="loop" style="padding:.4rem .7rem">🔁</button> <button data-c="mirrorDir" style="padding:.4rem .7rem">↔/↕</button></p></details>
<script>
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search); let room=(q.get('room')||localStorage.getItem('tp-remote-room')||'').toUpperCase(); $('room').value=room;
$('room').onchange=()=>{ room=$('room').value.trim().toUpperCase(); localStorage.setItem('tp-remote-room',room); connect(); };
let ws, speed=60, playing=false, lastText=null, spans=[], marked=0, curW=-1, vfs=+localStorage.getItem('tp-vfs')||26, dragging=false, capsOn=false;
const send=(cmd,value)=>{ if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'cmd',cmd,value})); };
/* ---- texto (mesma tokenização do app para os índices baterem) ---- */
function build(text){
  const box=$('txt'); box.textContent=''; spans=[]; marked=0; curW=-1;
  const frag=document.createDocumentFragment();
  for(const line of text.replace(/\r\n?/g,'\n').split('\n')){
    for(const tok of line.split(/[ \t]+/)){ if(!tok)continue; const sp=document.createElement('span'); sp.textContent=tok+' '; frag.appendChild(sp); spans.push(sp); }
    if(line.trim()) frag.appendChild(document.createElement('br')); else { const g=document.createElement('div'); g.className='gap'; frag.appendChild(g); }
  }
  box.appendChild(frag); $('empty').style.display=spans.length?'none':'grid'; box.style.fontSize=vfs+'px'; highlight(0,true);
}
function highlight(w,force){
  if(!spans.length)return; w=Math.max(0,Math.min(spans.length-1,w|0)); if(w===curW&&!force)return;
  if(curW>=0&&spans[curW]) spans[curW].classList.remove('now');
  const a=Math.min(marked,w), b=Math.max(marked,w); for(let i=a;i<b;i++) spans[i].classList.toggle('rd',i<w);
  if(force){ for(let i=0;i<spans.length;i++) spans[i].classList.toggle('rd',i<w); }
  marked=w; curW=w; spans[w].classList.add('now');
  const v=$('view'); $('txt').style.transform=`translateY(${-(spans[w].offsetTop-v.clientHeight*0.38)}px)`;
}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ vfs=Math.max(14,Math.min(80,vfs+(+b.dataset.v))); localStorage.setItem('tp-vfs',vfs); $('txt').style.fontSize=vfs+'px'; highlight(curW,true); });
/* ---- estado vindo do app ---- */
function applyState(s){
  if(!dragging){ speed=s.speed; $('rng').value=speed; $('spd').textContent=speed; }
  $('pr').style.width=((s.progress||0)*100)+'%'; playing=s.playing; $('play').textContent=playing?'⏸ Pausar':'▶ Iniciar';
  $('mode').textContent={voice:'🎤',sound:'🔊',auto:'⏩'}[s.mode]||'⏩';
  $('caps').classList.toggle('on',!!s.caps); if(!!s.caps!==capsOn){ capsOn=!!s.caps; $('txt').style.textTransform=capsOn?'uppercase':'none'; highlight(curW,true); }
  $('bold').classList.toggle('on',!!s.bold); $('mirror').classList.toggle('on',!!s.mirror); $('guide').classList.toggle('on',!!s.guide);
  if(s.fontSize) $('fs').textContent=s.fontSize;
  if(typeof s.word==='number') highlight(s.word);
}
function connect(){
  try{ws&&(ws.onclose=null,ws.close())}catch{}
  if(!/^[A-Z0-9]{4,16}$/.test(room)){ $('st').textContent='Informe o código da sala (abaixo).'; return; }
  localStorage.setItem('tp-remote-room',room);
  ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws?room=${room}&role=controller`);
  ws.onopen=()=>{ $('st').textContent='Conectado — aguardando o app…'; ws.send(JSON.stringify({type:'needText'})); };
  ws.onclose=()=>{ $('st').textContent='Desconectado. Reconectando…'; setTimeout(connect,2000); };
  ws.onmessage=e=>{ const m=JSON.parse(e.data);
    if(m.type==='presence'){ $('st').textContent=m.prompter?'✅ App conectado':'Aguardando o app…'; if(m.prompter) ws.send(JSON.stringify({type:'needText'})); }
    if(m.type==='text'&&m.value!==lastText){ lastText=m.value; build(m.value); }
    if(m.type==='state') applyState(m.state); };
}
/* ---- botões ---- */
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ send(b.dataset.c); navigator.vibrate?.(12); });
$('rng').oninput=e=>{ speed=+e.target.value; $('spd').textContent=speed; sendSpeed(true); };
/* ---- toque na tela do texto: arrastar ↕ = velocidade, toque = play/pause ---- */
let lastSp=0, hudT; const view=$('view');
function sendSpeed(force){ const n=performance.now(); if(force||n-lastSp>70){ lastSp=n; send('speed',speed); } }
function hud(){ const h=$('hud'); h.textContent='⏩ '+speed+' px/s'; h.style.display='block'; clearTimeout(hudT); hudT=setTimeout(()=>h.style.display='none',900); }
let g=null;
view.addEventListener('pointerdown',e=>{ g={y:e.clientY,s:speed,moved:false}; try{view.setPointerCapture(e.pointerId);}catch{} });
view.addEventListener('pointermove',e=>{ if(!g)return; const dy=g.y-e.clientY;
  if(!g.moved&&Math.abs(dy)>10){ g.moved=true; dragging=true; }
  if(g.moved){ speed=Math.max(10,Math.min(600,Math.round((g.s+dy*0.8)/5)*5)); $('rng').value=speed; $('spd').textContent=speed; hud(); sendSpeed(); } });
const end=e=>{ if(!g)return; const tap=!g.moved&&e.type==='pointerup'; if(g.moved) sendSpeed(true); g=null; dragging=false; if(tap){ send('toggle'); navigator.vibrate?.(12); } };
view.addEventListener('pointerup',end); view.addEventListener('pointercancel',end);
connect();
</script></body></html>
